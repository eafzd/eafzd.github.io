name: Update Lassa Sentinel Images

on:
  schedule:
    # Run every Monday at 9:00 AM UTC (adjust timezone as needed)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

# Set permissions for the GITHUB_TOKEN
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-images:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Download PNG files with timestamps
      run: |
        python << 'EOF'
        import requests
        import os
        import base64
        from datetime import datetime
        import glob

        # Create images directory if it doesn't exist
        os.makedirs('assets/images/lassa-sentinel', exist_ok=True)

        # Generate timestamp for this update
        timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
        print(f"Using timestamp: {timestamp}")

        # Remove old images first to avoid caching issues
        old_files = glob.glob('assets/images/lassa-sentinel/*.png')
        if old_files:
            print(f"Removing {len(old_files)} old files:")
            for old_file in old_files:
                print(f"  - {old_file}")
                os.remove(old_file)
        else:
            print("No old files to remove")

        filenames = ['storymap-linechart.png', 'storymap-single-map.png', 'storymap-timeseries-map.png']

        base_url = "https://lassa-sentinel-app.blackcoast-d7c432f1.uksouth.azurecontainerapps.io/files/"

        downloaded_files = []
        failed_files = []
        new_filenames = []

        for filename in filenames:
            try:
                # Construct the full URL
                file_url = f"{base_url}{filename}?type=weekly"

                print(f"Downloading {filename}...")

                # Download the file
                response = requests.get(file_url, timeout=60)
                response.raise_for_status()
                decoded_content = base64.b64decode(response.json()['data'][0][22:])
                print(f"Successfully decoded base64 content for {filename}")

                # Create new filename with timestamp
                name, ext = os.path.splitext(filename)
                new_filename = f"{name}_{timestamp}{ext}"
                new_filenames.append(new_filename)

                # Save to the assets/images/lassa-sentinel directory with new name
                file_path = f"assets/images/lassa-sentinel/{new_filename}"
                with open(file_path, 'wb') as f:
                    f.write(decoded_content)

                downloaded_files.append(new_filename)
                print(f"Successfully downloaded and saved as {new_filename}")

            except Exception as e:
                print(f"Failed to download {filename}: {e}")
                failed_files.append(filename)

        print(f"Downloaded {len(downloaded_files)} files successfully")
        if failed_files:
            print(f"Failed to download {len(failed_files)} files: {failed_files}")

        # Save summary for commit message and filename mapping
        with open('download_summary.txt', 'w') as f:
            f.write(f"Downloaded {len(downloaded_files)} files: {', '.join(downloaded_files)}\n")
            if failed_files:
                f.write(f"Failed to download {len(failed_files)} files: {', '.join(failed_files)}\n")
            f.write(f"Timestamp: {timestamp}\n")

        # Save filename mapping for potential use in other steps
        with open('filename_mapping.txt', 'w') as f:
            for original, new_name in zip(filenames, new_filenames):
                f.write(f"{original},{new_name}\n")

        EOF
    
    - name: Update image references in markdown files
      run: |
        python << 'EOF'
        import os
        import glob
        import re

        # Read the filename mapping
        if os.path.exists('filename_mapping.txt'):
            with open('filename_mapping.txt', 'r') as f:
                mappings = {}
                for line in f:
                    original, new_name = line.strip().split(',')
                    mappings[original] = new_name
            
            print(f"Found {len(mappings)} filename mappings")
            
            # Find all markdown files
            markdown_files = glob.glob('*.markdown') + glob.glob('*.md')
            
            for md_file in markdown_files:
                print(f"Processing {md_file}")
                with open(md_file, 'r') as f:
                    content = f.read()
                
                original_content = content
                
                # Update each image reference
                for original, new_name in mappings.items():
                    # Replace the filename in image src attributes
                    pattern = f'/assets/images/lassa-sentinel/{re.escape(original)}'
                    replacement = f'/assets/images/lassa-sentinel/{new_name}'
                    content = re.sub(pattern, replacement, content)
                
                # Write back if changes were made
                if content != original_content:
                    with open(md_file, 'w') as f:
                        f.write(content)
                    print(f"Updated {md_file}")
                else:
                    print(f"No changes needed for {md_file}")
        else:
            print("No filename mapping found, skipping markdown updates")

        EOF
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Debug file system
      run: |
        echo "=== Current directory structure ==="
        ls -la
        echo "=== Assets directory ==="
        ls -la assets/ || echo "assets directory does not exist"
        echo "=== Images directory ==="
        ls -la assets/images/ || echo "assets/images directory does not exist"
        echo "=== Lassa-sentinel directory ==="
        ls -la assets/images/lassa-sentinel/ || echo "lassa-sentinel directory does not exist"
        echo "=== File sizes ==="
        find assets/images/lassa-sentinel/ -type f -exec ls -lh {} \; 2>/dev/null || echo "No files found in lassa-sentinel directory"

    - name: Commit and push changes
      run: |
        echo "=== Git status before adding ==="
        git status
        echo "=== Git diff ==="
        git diff
        echo "=== Git diff --staged ==="
        git diff --staged
        
        # Add all changes (including deletions of old files and additions of new files)
        git add -A assets/images/lassa-sentinel/ || echo "No lassa-sentinel directory changes to add"
        git add download_summary.txt || echo "No download_summary.txt to add"
        git add filename_mapping.txt || echo "No filename_mapping.txt to add"
        git add *.markdown || echo "No markdown files to add"
        git add *.md || echo "No md files to add"
        
        echo "=== Git status after adding ==="
        git status
        
        # Check if there are any changes to commit
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to commit"
        else
          # Create commit message
          if [ -f download_summary.txt ]; then
            commit_msg="Update Lassa Sentinel images: $(cat download_summary.txt)"
          else
            commit_msg="Update Lassa Sentinel images"
          fi
          
          # Commit changes
          git commit -m "$commit_msg"
          
          # Push to gh-pages branch
          git push origin gh-pages
          
          echo "Changes committed and pushed successfully"
        fi
    
    - name: Summary
      run: |
        echo "Workflow completed!"
        if [ -f download_summary.txt ]; then
          echo "Download summary:"
          cat download_summary.txt
        else
          echo "No files were downloaded"
        fi

