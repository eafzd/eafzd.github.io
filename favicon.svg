<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#2c3e50" stroke="#3498db" stroke-width="2"/>
  
  <!-- DNA helix representing disease/genetics -->
  <path d="M8 8 Q12 12, 16 8 Q20 4, 24 8 Q20 12, 16 8 Q12 4, 8 8" 
        fill="none" stroke="#3498db" stroke-width="1.5" opacity="0.8"/>
  <path d="M8 16 Q12 20, 16 16 Q20 12, 24 16 Q20 20, 16 16 Q12 20, 8 16" 
        fill="none" stroke="#3498db" stroke-width="1.5" opacity="0.8"/>
  <path d="M8 24 Q12 28, 16 24 Q20 20, 24 24 Q20 28, 16 24 Q12 28, 8 24" 
        fill="none" stroke="#3498db" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Connecting lines for DNA -->
  <line x1="12" y1="8" x2="12" y2="16" stroke="#3498db" stroke-width="1" opacity="0.6"/>
  <line x1="20" y1="8" x2="20" y2="16" stroke="#3498db" stroke-width="1" opacity="0.6"/>
  <line x1="12" y1="16" x2="12" y2="24" stroke="#3498db" stroke-width="1" opacity="0.6"/>
  <line x1="20" y1="16" x2="20" y2="24" stroke="#3498db" stroke-width="1" opacity="0.6"/>
  
  <!-- Central dot representing forecasting/prediction -->
  <circle cx="16" cy="16" r="2" fill="#ecf0f1"/>
  
  <!-- Small dots representing data points/forecasting -->
  <circle cx="10" cy="12" r="1" fill="#ecf0f1" opacity="0.8"/>
  <circle cx="22" cy="12" r="1" fill="#ecf0f1" opacity="0.8"/>
  <circle cx="10" cy="20" r="1" fill="#ecf0f1" opacity="0.8"/>
  <circle cx="22" cy="20" r="1" fill="#ecf0f1" opacity="0.8"/>
</svg>

